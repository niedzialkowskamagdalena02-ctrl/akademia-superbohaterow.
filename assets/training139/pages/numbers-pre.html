align-items:stretch}.answers button{flex:1 1 87px;min-height:57px;font-size:19px;overflow-wrap:anywhere}.good{background:#17644c!important;border-color:#98ffc1}.bad{background:#725223!important;border-color:#ffda75}.feedback{min-height:23px;margin:9px 0}.effect{display:flex;gap:6px;flex-wrap:wrap}.effect span{padding:4px 9px;border-radius:8px;background:#5a4385;border:1px solid #e2c7ff;animation:pop .35s both}.effect span:nth-child(2){animation-delay:.10s}.effect span:nth-child(3){animation-delay:.20s}@keyframes pop{0%{opacity:0;transform:translateY(7px) scale(.9)}}.foot{margin-top:13px}.foot .mic{padding:0;background:transparent;border:0}.mic img{width:50px;display:block}.gold{background:linear-gradient(#ffe7a3,#d6a44c);color:#14233b;border-color:#ffe0a4}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<main><header><button id="restart">← Od nowa</button><img src="../../space132/astronauta.png" alt=""></header><h1></h1>
<p class="counter" id="count"></p><div class="track" aria-hidden="true"><div class="fill"></div><img class="star" src="../../space132/gwiazda.png" alt=""><img class="ship" src="../../space132/rakieta_przezroczysta.png" alt=""><img class="treasure" src="../../space132/skrzynia.png" alt=""></div>
<div class="row"><button id="read">Odczytaj polecenie</button><button id="pause">Pauza</button></div>
<div class="guide"><img src="../../space132/robot.png" alt=""><img class="wave" src="../../space132/fala_dzwiekowa.png" alt=""><p id="guide"></p></div>
<article><blockquote hidden></blockquote><h2></h2><div class="target"><button id="hear">Posłuchaj liczby</button></div><div class="answers"></div><p class="feedback" role="status"></p><div class="effect"></div><button class="gold" id="next" hidden>Dalej</button></article>
<div class="row foot"><button id="skip">Pomiń bez zaliczenia</button><button id="ai">Zapytaj nauczyciela AI</button><button class="mic" id="mic" aria-label="Zadaj pytanie przez mikrofon"><img src="../../space132/mikrofon.png" alt=""></button></div>
<p id="info" role="status"></p></main>
<script>

const config=Training139.restore?.config||Training139.config.letterConfig;
const $=s=>document.querySelector(s);
const choices=$('.answers'), feedback=$('.feedback'), passage=$('blockquote'), effect=$('.effect');
let i=Training139.restore?.index||0, correct=Training139.restore?.score||0, skipped=Training139.restore?.skipped||0, locked=false, paused=false;
document.title=config.title;
$('h1').textContent=config.title;
$('#guide').textContent=config.theme;
function status(){
 const done=i===config.questions.length;
 $('#count').textContent=done?'Misja zakończona':'Wyzwanie '+(i+1)+' z '+config.questions.length;
 $('.track').style.setProperty('--progress',i/config.questions.length*100+'%');
 for(const id of ['read','skip','pause'])$('#'+id).hidden=done;
}
function render(){
 Training139.save({index:i,score:correct,skipped,config,roundComplete:false,context:{question:"Którą liczbę słyszysz?",answer:config.questions[i]?.[2]?.[config.questions[i]?.[3]],options:config.questions[i]?.[2]}});
 status();
 locked=false;
 choices.replaceChildren();
 effect.replaceChildren();
 passage.hidden=true;
 $('#next').hidden=true;
 feedback.textContent='';
 let q=config.questions[i];
 $('.target').hidden=!q;
 if(!q){
  $('h2').textContent='Raport z misji';
  feedback.textContent='Poprawne: '+correct+' · pominięte: '+skipped;
  return;
 }
 $('h2').textContent='Którą liczbę słyszysz?';
 speak(q[4]);

 if(q[1]){passage.hidden=false;passage.textContent=q[1];}
 q[2].forEach((answer,index)=>{
  const btn=document.createElement('button');
  btn.textContent=answer;
  btn.onclick=()=>{
   if(locked||paused)return;
   for(const b of choices.querySelectorAll('.pick'))b.classList.remove('bad');
   if(index!==q[3]){
    btn.classList.add('bad');
    feedback.textContent='Spróbuj jeszcze raz.';
    return;
   }
   locked=true;
   correct++;Training139.save({index:i+1,score:correct,skipped,config,roundComplete:true});
   btn.classList.add('good');
   for(const b of choices.querySelectorAll('.pick'))b.disabled=true;
   feedback.textContent=q[5];
   if(config.mode===2){
    const start=q[1].indexOf(q[4]);
    if(start>=0){
     const highlight=document.createElement('mark');
     highlight.textContent=q[4];
     passage.replaceChildren(q[1].slice(0,start),highlight,q[1].slice(start+q[4].length));
    }
   }else for(const label of q[4].split('|')){
    const tile=document.createElement('span');
    tile.textContent=label;
    effect.append(tile);
   }
   $('.track').style.setProperty('--progress',(i+1)/config.questions.length*100+'%');
   $('#next').hidden=false;
   $('#skip').hidden=true;
  };
  btn.className='pick';
  const tile=document.createElement('div');
  tile.className='answer-tile';
  const sound=document.createElement('button');
  sound.className='sound';
  sound.textContent='♫';
  sound.setAttribute('aria-label','Odsłuchaj liczbę '+answer);
  sound.onclick=()=>speak(answer);
  tile.append(btn,sound);
  choices.append(tile);
 });
}
$('#next').onclick=()=>{if(locked&&!paused){i++;Training139.advance();render();}};
$('#skip').onclick=()=>{if(!locked&&!paused&&i<config.questions.length){i++;skipped++;Training139.advance();render();}};
$('#pause').onclick=()=>{
 paused=!paused;
 $('article').inert=paused;
 if(paused){window.speechSynthesis?.cancel();document.body.classList.remove('listening');}
 $('#pause').textContent=paused?'Wznów':'Pauza';
};
function speak(text){
 if(paused||!window.speechSynthesis)return;
 window.speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(text);
 speech.lang='pl-PL';
 speech.onend=speech.onerror=()=>document.body.classList.remove('listening');
 document.body.classList.add('listening');
 window.speechSynthesis.speak(speech);
}
$('#read').onclick=()=>{if(choices.hidden)speak('Znajdź liczbę, o której mówi lektor.');else if(config.questions[i])speak(config.questions[i][4]);};
$('#hear').onclick=()=>{if(config.questions[i])speak(config.questions[i][4]);};
$('#ai').onclick=$('#mic').onclick=()=>{$('#info').textContent='Miejsce na istniejącego nauczyciela AI w aplikacji.';};
$('#restart').onclick=()=>Training139.back();
choices.hidden=true;
$('.target').hidden=true;
$('#count').textContent='8 rund';
$('h2').textContent='Znajdź liczbę, o której mówi lektor.';
$('#skip').hidden=true;
const start=document.createElement('button');
start.textContent='Zaczynamy';
start.className='gold';
start.onclick=()=>{start.remove();choices.hidden=false;render();};
$('h2').after(start);

Training139.onSkip=()=>{if(!locked){i++;skipped++;render();}};
</script></html>
