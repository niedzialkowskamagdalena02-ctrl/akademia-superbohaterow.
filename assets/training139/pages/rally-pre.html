  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  if(bag.at(-1)===lastBackground)bag.unshift(bag.pop());
 }
 lastBackground=bag.pop();Training139.save({backgroundBag:bag,lastBackground});return lastBackground;
}
const $=s=>document.querySelector(s);
const play=$('#play'), message=$('.message'), heading=$('#heading');
let index=Training139.restore?.index||0;
const instruction=mode==='order'?'Dotykaj liter w kolejności alfabetu.':mode==='rhyme'?'Posłuchaj rymowanki i wskaż pierwszą literę odgadniętego słowa.':'Zacznij od pomarańczowej kropki i prowadź palec do flagi.';
function speak(text){
 if(!window.speechSynthesis){$('#details').textContent='Odsłuch wymaga polskiego głosu w przeglądarce.';return;}
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='pl-PL';
 utterance.onend=utterance.onerror=()=>document.body.classList.remove('listening');
 document.body.classList.add('listening');
 speechSynthesis.speak(utterance);
}
function element(tag,text,cls){
 const node=document.createElement(tag);
 if(text!==undefined)node.textContent=text;
 if(cls)node.className=cls;
 return node;
}
function button(text,action,cls){
 const node=element('button',text,cls);
 node.type='button';node.onclick=action;
 return node;
}
function progress(n){$('.track').style.setProperty('--done',n/rounds.length*100+'%');}
let currentBackground;
function render(keepScene=false){
 Training139.save({index,rounds,context:{question:"Narysuj znak po śladzie.",answer:rounds[index][0]}});
 if(!currentBackground&&Training139.restore?.lastBackground)currentBackground=Training139.restore.lastBackground;else if(keepScene!==true)currentBackground=nextBackground();
 play.replaceChildren();message.textContent='';
 const q=rounds[index];
 progress(index);
 $('#count').textContent=q?'Wyzwanie '+(index+1)+' z '+rounds.length:'Trasa ukończona';
 if(!q){
  heading.textContent='Brawo, misja ukończona!';
  play.append(button('Zagraj ponownie',()=>{index=0;render();},'gold'));
  return;
 }
 if(mode==='trace'){trace();return;}
 heading.textContent=mode==='order'?'Ułóż litery w kolejności.':'Jaka jest pierwsza litera?';
 const answer=mode==='order'?q[1]:[q[3]];
 let picks=[];
 if(mode==='rhyme')play.append(element('div',q[0],'picture'),element('p',q[1]),button('Posłuchaj rymowanki',()=>speak(q[1])));
 else play.append(button('Odczytaj polecenie',()=>speak(instruction)));
 const slots=element('div',undefined,'slots'), choices=element('div',undefined,'choices');
 if(mode==='order'){
  answer.forEach(()=>slots.append(element('span')));
  play.append(slots);
 }
 play.append(choices);
 const options=q[mode==='order'?0:2];
 for(const letter of options){
  const tile=element('div');
  const pick=button(letter,()=>{
   for(const b of choices.querySelectorAll('.bad'))b.classList.remove('bad');
   if(letter!==answer[picks.length]){
    pick.classList.add('bad');message.textContent='Spróbuj jeszcze raz.';return;
   }
   if(mode==='order')slots.children[picks.length].textContent=letter;
   picks.push(letter);pick.disabled=true;pick.classList.add('good');
   if(picks.length===answer.length){
    for(const b of choices.querySelectorAll('.pick'))b.disabled=true;
    message.textContent=mode==='rhyme'?q[4]+' zaczyna się na '+letter+'.':'Dobra kolejność: '+picks.join(' → ')+'.';
    progress(index+1);
    play.append(button('Dalej',()=>{index++;render();},'gold'));
   } else message.textContent='Dobrze. Wybierz kolejną literę.';
  },'pick');
  const audio=button('♫',()=>speak(letter));
  audio.setAttribute('aria-label','Posłuchaj '+letter);
  tile.append(pick,audio);choices.append(tile);
 }
}
function trace(){
 heading.textContent='Prowadź samochodzik po śladzie';
 const [glyph,strokes]=rounds[index];
 const road=element('div',undefined,'road');
 road.style.backgroundImage=Training139.css('url('+currentBackground+')');
 const car=element('img',undefined,'car');car.src=Training139.asset('../../training139/media/954d21e1e7a3_samochodzik.png');car.alt='';
 const canvas=element('canvas');
 canvas.width=canvas.height=400;
 canvas.setAttribute('aria-label','Narysuj znak '+glyph+' od świecącej kropki');
 const ctx=canvas.getContext('2d');
 let piece=0,checkpoint=0,active=null,ink=[],lastPoint=null,frame=null;
 function sample(stroke){
  return stroke.flatMap((end,n)=>{
   if(!n)return [end];
   const start=stroke[n-1], steps=Math.max(1,Math.ceil(Math.hypot(end[0]-start[0],end[1]-start[1])/12));
   return Array.from({length:steps},(_,k)=>start.map((p,d)=>p+(end[d]-p)*(k+1)/steps));
  });
 }
 const stages=strokes.flatMap((stroke,strokeIndex)=>{
  const points=sample(stroke);
  const steps=points.length-1;
  const count=Math.max(1,Math.ceil(steps/8));
  return Array.from({length:count},(_,i)=>({
   strokeIndex,
   points:points.slice(Math.round(i*steps/count),Math.round((i+1)*steps/count)+1)
  }));
 });
 const paths=stages.map(stage=>stage.points);
 function line(points,color,width,dashes=[]){
  if(!points.length)return;
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dashes);
  ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();ctx.setLineDash([]);
 }
 const distances=paths.map(path=>{
  const lengths=[0];
  for(let n=1;n<path.length;n++)lengths.push(lengths[n-1]+Math.hypot(path[n][0]-path[n-1][0],path[n][1]-path[n-1][1]));
  return lengths;
 });
 function directionArrows(path){
  const lengths=distances[piece];
  const remaining=lengths.at(-1)-lengths[checkpoint];
  if(remaining<18)return;
  const first=remaining<72?remaining*.60:48;
  for(let offset=first;offset<remaining;offset+=62){
   const distance=lengths[checkpoint]+offset;
   const n=lengths.findIndex(length=>length>=distance);
   const [ax,ay]=path[n-1], [bx,by]=path[n];
   const segment=lengths[n]-lengths[n-1];
   const fraction=(distance-lengths[n-1])/segment;
   const dx=(bx-ax)/segment, dy=(by-ay)/segment;
   ctx.save();
   ctx.translate(ax+(bx-ax)*fraction-dy*17,ay+(by-ay)*fraction+dx*17);
   ctx.rotate(Math.atan2(dy,dx));
   const shaft=[[-9,0],[9,0]], head=[[2,-6],[9,0],[2,6]];
   for(const [color,width] of [['#ffffff',9],['#7a3000',5],['#ffba27',2]]){
    line(shaft,color,width);line(head,color,width);
   }
   ctx.restore();
  }
 }
 function marker([x,y],finish){
  ctx.save();
  ctx.translate(x,y);
  line([[0,9],[0,-17]],'#fff',6);
  line([[0,9],[0,-17]],'#17335d',3);
  ctx.strokeStyle='#17335d';ctx.lineWidth=2;
  ctx.fillStyle=finish?'#fff':'#ffcb53';
  ctx.fillRect(0,-17,20,14);ctx.strokeRect(0,-17,20,14);
  if(finish){
   ctx.fillStyle='#17335d';
   for(let row=0;row<2;row++)for(let col=0;col<4;col++){
    if((row+col)%2===0)ctx.fillRect(col*5,-17+row*7,5,7);
   }
   ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.lineWidth=4;
   ctx.strokeStyle='#fff';ctx.strokeText('META',10,-23);ctx.fillText('META',10,-23);
  }
  ctx.restore();
 }
 function draw(){
  ctx.clearRect(0,0,400,400);ctx.lineCap='round';ctx.lineJoin='round';
  for(const y of [65,135,265,335])line([[18,y],[382,y]],'#a6c7df',2);
  strokes.forEach((s,i)=>line(s,i===stages[piece]?.strokeIndex?'#34587c':'#829bb2',7,[6,9]));
  ink.forEach(s=>line(s,'#1674ce',8));
  if(paths[piece]){
   const [x,y]=paths[piece][checkpoint];car.style.setProperty('--x',x/4+'%');car.style.setProperty('--y',y/4+'%');
   directionArrows(paths[piece]);
   const isDot=dotStage(paths[piece]);
   if(!isDot||piece===paths.length-1)marker(paths[piece].at(-1),piece===paths.length-1);
   ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);
   ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.fillStyle='#e85822';ctx.fill();ctx.stroke();
  }
 }
 function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*400/r.height];}
 function close(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])<20;}
 function scheduleDraw(){
  if(frame!==null)return;
  frame=requestAnimationFrame(()=>{frame=null;draw();});
 }
 function dotStage(path){
  return path.length===2&&Math.hypot(path[1][0]-path[0][0],path[1][1]-path[0][1])<10;
 }
 function reachStop(){
  const previous=stages[piece].strokeIndex;
  piece++;checkpoint=0;
  if(piece===paths.length){
   active=null;message.textContent='Meta! Brawo, litera gotowa!';
   progress(index+1);Training139.save({index:index+1,rounds,lastBackground:null});Training139.advance();road.classList.add('finished');car.classList.add('victory');
  }else if(stages[piece].strokeIndex!==previous){
   active=null;
   message.textContent=dotStage(paths[piece])?'Dotknij kropki.':'Zacznij następną kreskę od pomarańczowej kropki.';
  }else{
   message.textContent='Przystanek zaliczony! Jedź do następnej flagi.';
  }
 }
 canvas.onpointerdown=e=>{
  if(!paths[piece]||active!==null)return;
  const p=point(e), path=paths[piece];
  if(!close(p,path[0])){message.textContent='Zacznij od pomarańczowej kropki.';return;}
  active=e.pointerId;lastPoint=p;canvas.setPointerCapture(active);ink[piece]=[path[0]];
  if(dotStage(path)){
   ink[piece].push(path.at(-1));
   reachStop();
  }
  draw();
 };
 function advance(p){
  const path=paths[piece];
  ink[piece]??=[path[0]];
  while(checkpoint+1<path.length&&close(p,path[checkpoint+1])){
   checkpoint++;ink[piece].push(path[checkpoint]);
  }
  if(checkpoint===path.length-1)reachStop();
 }
 canvas.onpointermove=e=>{
  if(e.pointerId!==active)return;
  const events=e.getCoalescedEvents?.()??[];
  for(const event of events.length?[...events,e]:[e]){
   if(active===null)break;
   const p=point(event), from=lastPoint;
   const gap=Math.hypot(p[0]-from[0],p[1]-from[1]);
   // Bridge sparse samples without accepting long jumps across the board.
   const steps=gap<=96?Math.max(1,Math.ceil(gap/6)):1;
   for(let i=1;i<=steps&&active!==null;i++){
    advance([from[0]+(p[0]-from[0])*i/steps,from[1]+(p[1]-from[1])*i/steps]);
   }
   lastPoint=p;
  }
  scheduleDraw();
 };
 function end(e){
  if(e.pointerId!==active)return;
  active=null;lastPoint=null;checkpoint=0;ink.length=piece;
  message.textContent=piece?'Rusz od ostatniego punktu startu. Ukończone odcinki są zaliczone.':instruction;
  draw();
 }
 canvas.onpointerup=e=>{canvas.onpointermove(e);end(e);};
 canvas.onpointercancel=end;
 canvas.onlostpointercapture=end;
 const toolbar=element('div',undefined,'row');
 toolbar.append(button('Posłuchaj znaku',()=>speak(signSpeech(glyph))));
 const controls=element('div',undefined,'row');
 controls.append(button('Wyczyść',()=>render(true)),button('Następny znak',nextSign,'gold'));
 road.append(canvas,car);play.append(toolbar,road,controls);message.textContent=instruction;
 $('#count').textContent='Znak '+(index+1)+' z '+rounds.length;
 draw();
}
$('#back').onclick=()=>Training139.back();
$('#ai').onclick=$('#mic').onclick=()=>{$('#details').textContent='W aplikacji ten przycisk otwiera istniejącą pomoc nauczyciela AI.';};
heading.textContent='Gotowi do startu?';
play.append(button('Zaczynamy',render,'gold'),button('Odczytaj polecenie',()=>speak(instruction)));

Training139.onSkip=nextSign;
</script></html>
