<script>window.TRAINING139_ASSETS={"tlo.webp": "../../training139/media/328f29921597_08_dolina_dinozaurow.webp", "nowe/latarka.png": "../../training139/media/6f448d65ceb8_latarka.png", "nowe/konewka.png": "../../training139/media/22609c3efd10_konewka.png", "nowe/parasol.png": "../../training139/media/effb3674dc14_parasol.png", "nowe/pacholek.png": "../../training139/media/71493f000689_pacholek.png", "nowe/skarpetka.png": "../../training139/media/d5006a41a775_skarpetka.png", "nowe/klepsydra.png": "../../training139/media/7aae9b7269c6_klepsydra.png", "nowe/oko.png": "../../training139/media/28229654c06e_oko.png", "nowe/klodka.png": "../../training139/media/fe2383e92525_klodka.png", "nowe/lodz.png": "../../training139/media/795c20ee9070_lodz.png", "nowe/szczoteczka.png": "../../training139/media/c7d08b87bc33_szczoteczka.png", "grafiki/jablko.png": "../../training139/media/1ac84aee5f89_jablko.png", "grafiki/mis.png": "../../training139/media/a30511acc686_mis.png", "grafiki/klocek.png": "../../training139/media/af30beaa7ac8_klocek.png", "grafiki/balon.png": "../../training139/media/b075260f15f7_balon.png", "grafiki/gruszka.png": "../../training139/media/97c752110094_gruszka.png", "grafiki/prezent.png": "../../training139/media/f8ffd88e6591_prezent.png", "dino/glodny.png": "../../training139/media/2b4a4f9665dc_glodny.png", "dino/brzuch.png": "../../training139/media/77e7fb921901_brzuch.png", "dino/gryzie.png": "../../training139/media/fb4671d5524c_gryzie.png"};</script><script src="../frame-bridge.js?v=140"></script><style>
*{box-sizing:border-box}body{margin:0;background:#0c2432;color:#fff;font:17px system-ui}main{max-width:920px;margin:auto;padding:16px}h1{color:#ffdf87;font-size:clamp(25px,6vw,49px);margin:0 0 12px}.scene{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:end;min-height:450px;padding:16px;background:#589268 url(../../training139/media/328f29921597_08_dolina_dinozaurow.webp) center/cover;border:2px solid #b2e7fb;border-radius:23px;overflow:hidden}.dino{width:100%;background:transparent;border:0;cursor:pointer;padding:0;position:relative}.dino img{display:block;width:100%;height:clamp(170px,33vw,310px);object-fit:contain;object-position:center bottom;pointer-events:none}.bubble{position:absolute;left:8%;top:12px;border:4px solid #fff;border-radius:25px;background:#daf6ff;padding:7px;box-shadow:0 5px 12px #163e6d60}.bubble img{width:84px;height:78px;object-fit:contain}.eggs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;align-self:center;padding-top:38px}.egg{width:clamp(43px,11vw,84px);height:clamp(57px,14vw,105px);border-radius:51% 51% 47% 47% / 66% 66% 35% 35%;border:2px solid #fff;color:white;background:radial-gradient(ellipse at 32% 25%,#ffffffe0 0%,var(--egg) 29%,#12203b 128%);font-weight:900;font-size:clamp(24px,6vw,51px);text-shadow:0 2px 4px #1b2035;box-shadow:0 6px 11px #183a3b80;touch-action:none;cursor:grab}.egg[aria-pressed=true]{outline:4px solid #ffe583}.egg.drag{position:relative;z-index:3}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools button{font:inherit;font-weight:bold;background:#ffdb83;color:#122739;border:0;border-radius:12px;padding:11px}.bite{animation:chew .22s alternate infinite}.rub{animation:rub .33s alternate infinite}@keyframes chew{to{transform:scale(1.025,.965)}}@keyframes rub{to{transform:rotate(2deg) scale(1.025)}}@media(max-width:520px){.scene{min-height:345px;padding:7px}.bubble img{width:62px;height:59px}}@media(prefers-reduced-motion:reduce){.bite,.rub{animation:none}}
[hidden]{display:none!important}.bubble{max-width:85%;z-index:1;color:#1a3550}.egg{font-family:inherit}.older .egg{width:auto;min-width:76px;padding:0 12px;font-size:clamp(15px,3vw,25px)}.older .eggs{align-self:end;padding-bottom:25px}select{font:inherit;padding:6px}.flight-egg{position:fixed!important;pointer-events:none;z-index:8}.bubble:after{content:"";position:absolute;top:100%;left:55%;width:13px;height:13px;background:#daf6ff;border-radius:50%;box-shadow:8px 10px 0 -3px #daf6ff}</style><style>#filter,#scene,#random{display:none!important}body .lg92-trace-board{background:#fff9e9}body [data-trace-start]{fill:#ffc83d;filter:drop-shadow(0 0 3px #f0b800)}.slots.complete{box-shadow:0 0 20px #79edb1}.training139-paused{pointer-events:none;filter:blur(3px)}body.training139-paused *{animation-play-state:paused!important}</style>
<main><h1>Dinozaur Pożeracz Literek</h1><label id="filter" hidden>Temat <select id="topic"><option value="">Wszystkie przykłady</option></select></label><p id="task"></p><div class="scene"><div class="bubble"><img id="objet" alt=""><strong id="bubble-text" hidden></strong></div><button class="dino" id="dino" aria-label="Nakarm dinozaura"><img id="pose" alt=""></button><div class="eggs"></div></div>
<p id="notice" role="status"></p><div class="tools"><button id="pause">Pauza</button><button id="listen">Odczytaj polecenie</button><button id="word">Posłuchaj nazwy obrazka</button><p id="score"></p></div></main>
<script>

const bank=Training139.config.objects;
const older=document.documentElement.dataset.group==='klasy';
const tasks=Training139.config.dinoTasks;
const $=s=>document.querySelector(s);
const pose=$('#pose'), dino=$('#dino'), eggs=$('.eggs'), notice=$('#notice');
const poses=['glodny','gryzie','brzuch'].map(x=>'dino/'+x+'.png');
for(const src of poses){const im=new Image();im.src=Training139.asset(src);}
const palette=['#ef70a6','#52a5f9','#ffbe36','#fe825f','#47c580'];
function mix(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);}
let queue=[],current,score=0,selected=null,busy=false,last,answer,paused=false,requestedTopic='';
const topic=$('#topic');
if(older){
 document.body.classList.add('older');$('#filter').hidden=true;
 $('#objet').hidden=true;$('#bubble-text').hidden=false;$('#word').hidden=true;
 for(const name of new Set(tasks.map(t=>t.temat))){
  const option=document.createElement('option');option.value=name;option.textContent=name;topic.append(option);
 }
 topic.onchange=()=>{if(!busy&&!paused){requestedTopic=topic.value;queue=[];round();}};
}
$('#pause').onclick=()=>{
 if(busy)return;
 paused=!paused;
 dino.disabled=paused;
 for(const egg of eggs.children)egg.disabled=paused;
 topic.disabled=paused;
 $('#pause').textContent=paused?'Wznów':'Pauza';
 if(paused)window.speechSynthesis?.cancel();
};

function round(){
 if(!queue.length){queue=mix(older?tasks.filter(t=>!requestedTopic||t.temat===requestedTopic):bank);if(queue.length>1&&queue.at(-1)===last)queue.unshift(queue.pop());}
 current=queue.pop();last=current;selected=null;busy=false;
 pose.src=Training139.asset(poses[0]);
 if(older){
  $('#task').textContent=current.polecenie;
  $('#bubble-text').textContent=current.dymek;
 }else{
  $('#task').textContent='Podaj dinozaurowi jajko z pierwszą literą nazwy obrazka.';
  $('#objet').src=Training139.asset(current.plik);$('#objet').alt=current.nazwa;
 }
 $('#score').textContent='Punkty: '+score;
 notice.textContent='Wybierz i przeciągnij jajko albo stuknij w jajko, a potem w dinozaura.';
 const letter=older?current.poprawna:current.nazwa[0].toLocaleUpperCase('pl');
 answer=letter;Training139.save({queue,current,score,context:{question:older?current.polecenie:$('#task').textContent,answer:letter,word:current.nazwa,options:older?current.opcje:[]}});
 const decoys=mix([...new Set(bank.map(x=>x.nazwa[0].toLocaleUpperCase('pl')))].filter(x=>x!==letter)).slice(0,4);
 eggs.replaceChildren(...mix(older?current.opcje:[letter,...decoys]).map((value,i)=>{
  const egg=document.createElement('button');egg.className='egg';egg.textContent=value;
  egg.style.setProperty('--egg',palette[i]);egg.setAttribute('aria-pressed','false');
  egg.onclick=()=>{if(!busy&&!paused&&!egg.skipClick){selected=egg;for(const node of eggs.children)node.setAttribute('aria-pressed',String(node===egg));notice.textContent='Teraz stuknij w dinozaura.';}};
  let drag;
  egg.onpointerdown=e=>{if(busy||paused||drag||e.button!==0)return;egg.skipClick=false;drag=[e.pointerId,e.clientX,e.clientY];egg.setPointerCapture(e.pointerId);};
  egg.onpointermove=e=>{if(drag?.[0]!==e.pointerId)return;egg.classList.add('drag');egg.style.transform='translate('+(e.clientX-drag[1])+'px,'+(e.clientY-drag[2])+'px)';};
  function finish(e,drop){
   if(drag?.[0]!==e.pointerId)return;
   const moved=Math.hypot(e.clientX-drag[1],e.clientY-drag[2])>8;
   drag=null;egg.classList.remove('drag');egg.style.transform='';
   if(drop&&moved){
    egg.skipClick=true;
    const box=dino.getBoundingClientRect();
    if(e.clientX>=box.left&&e.clientX<=box.right&&e.clientY>=box.top&&e.clientY<=box.bottom)feed(egg);
   }
  }
  egg.onpointerup=e=>finish(e,true);
  egg.onpointercancel=e=>finish(e,false);
  return egg;
 }));
}
async function feed(egg){
 if(busy||paused||!egg)return;
 if(egg.textContent!==answer){notice.textContent=(older?'Spróbuj innego jajka.':'Spróbuj innego jajka. Możesz odsłuchać nazwę obrazka.');return;}
 busy=true;topic.disabled=true;score++;$('#score').textContent='Punkty: '+score;
 for(const button of eggs.children)button.disabled=true;
 egg.style.visibility='hidden';notice.textContent='Brawo! Dinozaur gryzie jajko.';
 const wait=(ms)=>new Promise(resolve=>setTimeout(resolve,matchMedia("(prefers-reduced-motion: reduce)").matches?0:ms));
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&egg.animate){
  const box=egg.getBoundingClientRect(), mouth=pose.getBoundingClientRect();
  const flyer=egg.cloneNode(true);flyer.classList.add('flight-egg');flyer.style.cssText=egg.style.cssText;
  Object.assign(flyer.style,{left:box.left+'px',top:box.top+'px',visibility:'visible'});
  document.body.append(flyer);
  const dx=mouth.left+mouth.width*.74-box.left-box.width/2;
  const dy=mouth.top+mouth.height*.48-box.top-box.height/2;
  await flyer.animate([{transform:'none'},{transform:'translate('+dx+'px,'+dy+'px) scale(.2)',opacity:0}],{duration:300,easing:'ease-in',fill:'forwards'}).finished.catch(()=>{});
  flyer.remove();
 }
 dino.classList.add('bite');
 for(let i=0;i<4;i++){pose.src=Training139.asset(poses[i%2===0?1:0]);await wait(150);}
 dino.classList.replace('bite','rub');pose.src=Training139.asset(poses[2]);notice.textContent='Mniam!';await wait(720);
 dino.classList.remove('rub');topic.disabled=false;Training139.advance();round();
}
dino.onclick=()=>feed(selected);
function say(text){if(paused||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pl-PL';speechSynthesis.speak(u);}
$('#listen').onclick=()=>say(older?current.polecenie+'. '+current.dymek:$('#task').textContent);
$('#word').onclick=()=>say(current.nazwa);
round();

Training139.onSkip=()=>{if(!busy)round();};if(Training139.restore?.current){queue=Training139.restore.queue||[];queue.push(Training139.restore.current);score=Training139.restore.score||0;round();}
</script></html>
