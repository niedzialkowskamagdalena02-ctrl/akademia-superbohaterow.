<main><header><button id="restart">← Od nowa</button><img src="../../space132/astronauta.png" alt=""></header><h1>Zaczarowany Aparat</h1>

<script>

const scenes=[["Plac zabaw", "../../training139/media/debf6d2fe1fd_01_plac_zabaw.webp"], ["Leśny strumień", "../../training139/media/694409cc48ef_02_lesny_strumien.webp"], ["Górska łąka", "../../training139/media/9491b16dddec_03_gorska_laka.webp"], ["Tropikalna plaża", "../../training139/media/3e3257c8738e_04_tropikalna_plaza.webp"], ["Jesienny park", "../../training139/media/5fd83ccc5775_05_jesienny_park.webp"], ["Zimowa wioska", "../../training139/media/c1a3dc29ec72_06_zimowa_wioska.webp"], ["Rafa koralowa", "../../training139/media/47e4f0289782_07_rafa_koralowa.webp"], ["Dolina dinozaurów", "../../training139/media/328f29921597_08_dolina_dinozaurow.webp"], ["Ogród przy zamku", "../../training139/media/ff6b8266544d_09_ogrod_zamku.webp"], ["Kraina słodyczy", "../../training139/media/ac19631f1a38_10_kraina_slodyczy.webp"], ["Smocza góra", "../../training139/media/295323bc52f8_11_smocza_gora.webp"], ["Wyspy w chmurach", "../../training139/media/722b40f33a67_12_wyspy_w_chmurach.webp"], ["Gospodarstwo", "../../training139/media/4140632e21b3_13_gospodarstwo.webp"], ["Ogród zoologiczny", "../../training139/media/de3d7806c11a_14_ogrod_zoologiczny.webp"], ["Warsztat zabawek", "../../training139/media/2cf2957f9372_15_warsztat_zabawek.webp"], ["Biblioteka", "../../training139/media/8b310f4655ed_16_biblioteka.webp"], ["Stacja kolejowa", "../../training139/media/4044e9c207a8_17_stacja_kolejowa.webp"], ["Park miejski", "../../training139/media/d7e2248e0311_18_park_miejski.webp"], ["Stacja kosmiczna", "../../training139/media/a7460df581cb_19_stacja_kosmiczna.webp"], ["Baza na Księżycu", "../../training139/media/68798127d248_20_baza_ksiezycowa.webp"], ["Obca planeta", "../../training139/media/5c5a28fe7ed0_21_obca_planeta.webp"], ["Wyspa piratów", "../../training139/media/94c4e98eebf2_22_wyspa_piratow.webp"], ["Pustynna oaza", "../../training139/media/3162d41e9e3d_23_pustynna_oaza.webp"], ["Festiwal lampionów", "../../training139/media/afdf519d3bd9_24_festiwal_lampionow.webp"]];
const rounds=Training139.restore?.rounds||Training139.config.cameraRounds;
const props=[['balon','34%'],['jablko','62%'],['prezent','64%'],['gruszka','64%'],['pilka','50%'],['wiaderko','60%'],['muszla','48%'],['dynia','58%']];
const points=[[15,21],[40,16],[70,20],[21,51],[53,46],[83,48],[20,79],[63,77]];
const $=s=>document.querySelector(s);
const board=$('.board'), select=$('#scene');
let round=Training139.restore?.round||0, found=0, scene=0;let sceneBag=Training139.restore?[...Training139.restore.sceneBag,Training139.restore.scene]:[],seen=[];
for(const [i,entry] of scenes.entries()){
 const option=document.createElement('option');option.value=i;option.textContent=entry[0];select.append(option);
}
function setScene(i){
 scene=i;select.value=i;
 $('#background').src=scenes[i][1];
 $('#background').alt=scenes[i][0];
 for(const [index,object] of board.querySelectorAll('.object').entries())setProp(object,index);
}
select.onchange=()=>setScene(Number(select.value));
$('#random').onclick=()=>setScene((scene+1+Math.floor(Math.random()*(scenes.length-1)))%scenes.length);
function say(text){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const voice=new SpeechSynthesisUtterance(text);voice.lang='pl-PL';speechSynthesis.speak(voice);
}
function setProp(button,index){
 const [prop,y]=props[(index+scene+round)%props.length];
 button.querySelector('img').src='grafiki/'+prop+'.png';
 button.style.setProperty('--letter-y',y);
}
function render(){
 if(!sceneBag.length)sceneBag=Training139.shuffle(scenes.map((_,i)=>i));setScene(sceneBag.pop());seen=[];
 Training139.save({round,rounds,sceneBag,context:{question:"Sfotografuj wszystkie "+rounds[round][0],answer:rounds[round][0],options:rounds[round][1]}});
 const [target,letters]=rounds[round], total=letters.filter(x=>x===target).length;
 found=0;
 $('#question').textContent='Sfotografuj wszystkie '+target+'.';
 $('#count').textContent='Runda '+(round+1)+' / '+rounds.length+' · Zdjęcia: 0 / '+total;
 $('#message').textContent='';
 $('#next').hidden=true;
 board.querySelectorAll('.marker').forEach(x=>x.remove());
 letters.forEach((letter,i)=>{
  const wrapper=document.createElement('div');wrapper.className='marker';
  const [x,y]=points[(i+round*3)%points.length];wrapper.style.left=x+'%';wrapper.style.top=y+'%';
  const main=document.createElement('button');main.className='object';const prop=document.createElement('img');prop.alt='';
  const glyph=document.createElement('span');glyph.textContent=letter;main.append(prop,glyph);setProp(main,i);main.setAttribute('aria-label','Sfotografuj literę '+letter);
  const audio=document.createElement('button');audio.textContent='♫';audio.className='audio';audio.setAttribute('aria-label','Odsłuchaj '+letter);audio.onclick=()=>say(letter);
  main.onclick=()=>{
   if(found===total||main.disabled)return;
   if(letter!==target){main.classList.add('miss');$('#message').textContent='Poszukaj litery '+target+'.';return;}
   main.disabled=true;main.classList.add('found');main.setAttribute('aria-label','Sfotografowano literę '+letter);
   found++;seen.push(i);Training139.save({round,rounds,sceneBag,scene,seen});board.classList.remove('snap');void board.offsetWidth;board.classList.add('snap');
   $('#count').textContent='Runda '+(round+1)+' / '+rounds.length+' · Zdjęcia: '+found+' / '+total;
   $('#message').textContent=found===total?'Wszystkie litery sfotografowane!':'Zdjęcie gotowe!';
   if(found===total){$('#next').textContent=round===rounds.length-1?'Zagraj ponownie':'Następna runda';$('#next').hidden=false;}
  };
  wrapper.append(main,audio);board.append(wrapper);
 });
}
$('#next').onclick=()=>{round=(round+1)%rounds.length;Training139.advance();$('#random').click();render();};
$('#restart').onclick=()=>Training139.back();
$('#speak').onclick=()=>say($('#question').textContent);
$('#ai').onclick=$('#mic').onclick=()=>{$('#help').textContent='Miejsce na istniejącą pomoc nauczyciela AI.';};
setScene(0);render();

Training139.onSkip=()=>document.querySelector("#next").onclick();if(Training139.restore?.seen){for(const i of Training139.restore.seen)board.querySelectorAll(".object")[i]?.click();}
</script></html>
