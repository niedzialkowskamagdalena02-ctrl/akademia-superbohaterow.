<body><main><h1>Szafa Zwierzątek</h1><p>Dobierz ubrania z tą samą literą.</p><button id="read">Odczytaj polecenie</button>
<div class="layout" style="margin-top:12px"><section class="stage"><div class="label" id="round"></div><div class="pet"><img class="animal" alt=""><img class="head" alt="" aria-hidden="true"><img class="paw" src="../../training139/media/dd3aea9ff541_mis_lapa.png" alt="" hidden><img class="shirt" alt="" hidden><img class="shorts" alt="" hidden></div><span class="refusal" role="status" hidden>Nie!</span><span class="cheer" hidden>Jupii!</span><img class="spark" src="../../training139/media/eb97e33db883_gwiazda.png" alt="" hidden></section>
<section class="panel"><h2>Koszulki · wielkie litery</h2><div class="row" id="tops"></div><h2>Spodenki · małe litery</h2><div class="row" id="bottoms"></div><p class="status" role="status"></p><div class="actions"><button class="gold" id="next" hidden>Dalej</button></div></section></div></main>
<script>


const school=document.body.classList.contains("school");
const alphabet=[...'AĄBCĆDEĘFGHIJKLŁMNŃOÓPRSŚTUWYZŹŻ'];
const animals=[
 ['mis','miś'],['lis','lisek'],['krolik','królik'],['kot','kotek'],
 ['pies','piesek'],['swinka','świnka'],['panda','panda'],['kaczka','kaczuszka']
];
function shuffle(items){
 const result=[...items];
 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }
 return result;
}
function createRounds(previous){
 const targets=shuffle(alphabet);
 if(targets[0]===previous?.target)targets.push(targets.shift());
 let pets=[], lastAnimal=previous?.animal;
 return targets.map(target=>{
  if(!pets.length){
   pets=shuffle(animals);
   if(pets[0][0]===lastAnimal)pets.push(pets.shift());
  }
  const [animal,name]=pets.shift();
  lastAnimal=animal;
  const [a,b,c,d]=shuffle(alphabet.filter(letter=>letter!==target));
  return {animal,name,target,top:shuffle([target,a,b]),bottom:shuffle([target,c,d]).map(letter=>letter.toLocaleLowerCase('pl'))};
 });
}
const missions=Training139.config.closetMissions;
function schoolRounds(){
 return shuffle(animals).map(([animal,name],i)=>{
  const [mission,topTask,bottomTask,effect]=missions[i];
  return {animal,name,mission,topTask,bottomTask,effect,top:shuffle(topTask[1]),bottom:shuffle(bottomTask[1])};
 });
}
let rounds=Training139.restore?.rounds||(school?schoolRounds():createRounds());
const palettes={top:[0,102,208,319,45,260],bottom:[0,80,186,247,310,135]};
const fits={
 mis:{ratio:'377/474',shirt:[3, 46, 94, 34],shorts:[21, 73, 58, 22],neck:49},
 lis:{ratio:'374/482',shirt:[3, 49, 86, 32],shorts:[16, 75, 60, 21],neck:52},
 krolik:{ratio:'316/504',shirt:[1, 55, 98, 30],shorts:[19, 79, 62, 17],neck:58},
 kot:{ratio:'357/481',shirt:[3, 43, 94, 31],shorts:[24, 69, 53, 20],neck:46},
 pies:{ratio:'383/476',shirt:[3, 42, 94, 34],shorts:[22, 70, 56, 20],neck:45},
 swinka:{ratio:'364/479',shirt:[3, 43, 94, 34],shorts:[22, 71, 56, 20],neck:46},
 panda:{ratio:'362/485',shirt:[2, 42, 96, 35],shorts:[20, 71, 60, 20],neck:45},
 kaczka:{ratio:'364/488',shirt:[5, 45, 90, 34],shorts:[21, 72, 58, 18],neck:47}
};
function dressFit(pet,animal){
 const {ratio,shirt,shorts}=fits[animal];
 pet.style.setProperty('--ratio',ratio);
 for(const [name,values] of Object.entries({shirt,shorts})){
  ['x','y','w','h'].forEach((key,i)=>pet.style.setProperty('--'+name+'-'+key,values[i]+'%'));
 }
}
const $=s=>document.querySelector(s);
let index=Training139.restore?.index||0,selected={},solved=false,refusalFrame;
function speak(s){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='pl-PL';speechSynthesis.speak(u);}
const poses=Object.fromEntries(animals.map(([name])=>[name,['lewo','prawo'].map(side=>{
 const image=new Image();
 image.src=Training139.asset('grafiki/odmowa/'+name+'_'+side+'.png');
 return image;
})]));
function stopRefusal(){
 cancelAnimationFrame(refusalFrame);
 $('.pet').classList.remove('refusing');
 $('.refusal').hidden=true;
}
function refuse(name){
 stopRefusal();
 $('.refusal').hidden=false;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const face=$('.head'), pet=$('.pet');
 const [left,right]=poses[name];
 const start=performance.now();
 let shown;
 function draw(now){
  const elapsed=now-start;
  if(elapsed>=740){stopRefusal();return;}
  const pose=elapsed<145?left:elapsed<200?null:elapsed<350?right:
             elapsed<405?null:elapsed<535?left:elapsed<585?null:right;
  if(pose!==shown){
   shown=pose;
   const ready=!!(pose?.complete&&pose.naturalWidth);
   if(ready)face.src=Training139.asset(pose.src);
   pet.classList.toggle('refusing',ready);
  }
  refusalFrame=requestAnimationFrame(draw);
 }
 refusalFrame=requestAnimationFrame(draw);
}
function render(){
 stopRefusal();
 const current=rounds[index];selected={};solved=false;Training139.save({index,rounds,selected:{},context:{question:school?current.mission+". "+current.topTask[0]+" "+current.bottomTask[0]:"Dobierz wielką i małą literę.",answer:school?current.topTask[2]+", "+current.bottomTask[2]:current.target}});
 if(school){
  $('main > p').textContent=current.mission+' · Zdobądź dwie części stroju.';
  $('.panel h2').textContent='Koszulka · '+current.topTask[0];
  $('.panel h2:nth-of-type(2)').textContent='Spodenki · '+current.bottomTask[0];
  $('.cheer').textContent='Jupii! '+current.effect;
 }
 const pet=$('.pet');
 pet.classList.remove('dance','has-shirt','refusing');pet.classList.add('waiting');
 dressFit(pet,current.animal);
 $('.cheer').hidden=$('.spark').hidden=true;$('#next').hidden=true;
 $('#round').textContent=(index+1)+' / '+rounds.length+' · '+current.name;
 $('.paw').hidden=current.animal!=='mis';
 $('.animal').src='grafiki/'+(current.animal==='mis'?'mis_korpus':current.animal)+'.png';$('.animal').alt=current.name;

 $('.shirt').hidden=$('.shorts').hidden=true;
 $('.status').textContent='Wybierz koszulkę i spodenki.';
 for(const [id,group,file,layer] of [['tops','top','koszulka','shirt'],['bottoms','bottom','spodenki','shorts']]){
  const tiles=current[group].map((letter,i)=>{
   const tile=document.createElement('div');tile.className='tile';
   const pick=document.createElement('button');pick.className='pick';pick.setAttribute('aria-pressed','false');
   const img=document.createElement('img');img.src=Training139.asset('grafiki/'+file+'.png');img.alt='';img.style.filter='hue-rotate('+palettes[group][(index*2+i)%palettes[group].length]+'deg)';
   const text=document.createElement('strong');text.textContent=letter;pick.append(img,text);
   pick.onclick=()=>{
    if(solved||school&&selected[group])return;
    const target=school?current[group+'Task'][2]:
      group==='top'?current.target:current.target.toLocaleLowerCase('pl');
    if(letter!==target){
     refuse(current.animal);
     return;
    }
    stopRefusal();
    selected[group]=letter;Training139.save({selected});
    if(group==='top')pet.classList.add('has-shirt');
    for(const btn of $('#'+id).querySelectorAll('.pick'))btn.setAttribute('aria-pressed',String(btn===pick));
    const garment=$('.'+layer);garment.src=Training139.asset('grafiki/'+current.animal+'_'+file+'.png');garment.style.filter=img.style.filter;
    garment.hidden=false;garment.classList.remove('enter');void garment.offsetWidth;garment.classList.add('enter');
    if(!selected.top||!selected.bottom){$('.status').textContent='Teraz wybierz drugą część stroju.';return;}
    solved=true;Training139.save({index:index+1,rounds,selected:{}});$('.status').textContent=school?'Misja wykonana!':'Pasują do siebie! '+selected.top+' i '+selected.bottom+'.';
    pet.classList.remove('waiting');pet.classList.add('dance');$('.cheer').hidden=$('.spark').hidden=false;speak('Jupii!');
    $('#next').textContent=index===rounds.length-1?'Zagraj ponownie':'Następny zwierzak';$('#next').hidden=false;
   };
   const audio=document.createElement('button');audio.className='sound';audio.textContent='♫';audio.setAttribute('aria-label','Odsłuchaj '+letter);audio.onclick=()=>speak(letter);
   tile.append(pick,audio);return tile;
  });
  $('#'+id).replaceChildren(...tiles);
 }
}
$('#read').onclick=()=>speak(school?
 rounds[index].mission+'. Koszulka. '+rounds[index].topTask[0]+' Spodenki. '+rounds[index].bottomTask[0]:
 'Wybierz koszulkę i spodenki z tą samą literą. Na koszulce litera jest wielka, a na spodenkach mała.');
$('#next').onclick=()=>{if(solved){if(index===rounds.length-1){rounds=school?schoolRounds():createRounds(rounds[index]);index=0;}else{index++;}Training139.advance();render();}};
if(school)$('h1').textContent='Szafa Zwierzątek · Misje stylisty';
render();


Training139.onSkip=()=>{index=(index+1)%rounds.length;render();};if(Training139.restore?.selected){for(const [g,value]of Object.entries(Training139.restore.selected)){const node=document.querySelector(g==="top"?"#tops":"#bottoms");[...node.querySelectorAll(".pick")].find(b=>b.textContent===value)?.click();}}
</script></body></html>
