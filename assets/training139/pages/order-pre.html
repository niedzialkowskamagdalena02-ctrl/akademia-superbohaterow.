<script>window.TRAINING139_ASSETS={"grafiki/fala_dzwiekowa.png": "../../space132/fala_dzwiekowa.png", "grafiki/tlo.png": "../../space132/tlo.png", "grafiki/gwiazda.png": "../../space132/gwiazda.png", "grafiki/rakieta_przezroczysta.png": "../../space132/rakieta_przezroczysta.png", "grafiki/mikrofon.png": "../../space132/mikrofon.png", "grafiki/astronauta.png": "../../space132/astronauta.png", "grafiki/skrzynia.png": "../../space132/skrzynia.png", "grafiki/robot.png": "../../space132/robot.png"};</script><script src="../frame-bridge.js?v=140"></script><style>
*{box-sizing:border-box}body{margin:0;color:#f4f9ff;background:#081739 url(../../space132/tlo.png) center top/cover fixed;font:16px system-ui}main{max-width:690px;margin:auto;padding:20px 16px}h1{margin:12px 0;color:#ffe08b;font-size:clamp(29px,7vw,48px)}header,.row,.choices,.slots{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between}header img{width:58px}button,select{min-height:44px;padding:8px 13px;font:inherit;font-weight:700;color:white;background:#203e71;border:2px solid #76c8fa;border-radius:12px;cursor:pointer}button:disabled{opacity:.55;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid gold}.gold,.slots span{background:linear-gradient(#ffe9a0,#e9ad47);color:#192342;border-color:#ffdc82}.track{height:12px;margin:17px 29px 22px 12px;background:#1d3964;border:1px solid #6bc6ff;border-radius:20px;position:relative}.track img{position:absolute;top:50%;transform:translate(-50%,-50%);width:46px;transition:left .4s}.track .chest{left:100%;width:36px}.track .ship{left:var(--done,0%);z-index:1}.fill{height:100%;width:var(--done,0%);border-radius:20px;background:linear-gradient(90deg,#5de6ff,#ffdc78);transition:width .4s}.guide{display:flex;align-items:center;gap:13px;margin:10px 0}.guide img{width:100px;height:105px;object-fit:contain}.guide p{padding:12px;background:#e5f7ff;color:#14264b;border-radius:14px;font-weight:bold}.panel{background:#122852ef;border:2px solid #79d4ff;border-radius:23px;padding:16px;box-shadow:0 0 15px #52c8fb43}h2{margin:0 0 12px}.choices>div{flex:1;min-width:65px;display:grid;gap:5px}.choices button:first-child{font-size:26px}.slots{margin:10px 0;justify-content:center}.slots span{border:2px solid #ffdc82;border-radius:12px;min-width:52px;padding:7px;text-align:center;font-size:26px;font-weight:bold}.slots span:empty{background:#081d49;border:2px dashed #92d8ff}.slots span:empty:before{content:'·';color:#b8ddff}.picture{font-size:70px;text-align:center}.bad{border-color:#ffcf70;background:#684b38}.good{border-color:#acffd1;background:#216355}.message{min-height:24px;margin:12px 0}.wave{display:none;width:58px!important;position:absolute;left:0;transform:translateY(32px)}.listening .wave{display:block;animation:pulse .5s infinite alternate}.guide{position:relative}@keyframes pulse{to{opacity:.5;scale:.85}}.help{margin-top:14px}.mic{border:0;background:none;padding:0}.mic img{width:51px;display:block}canvas{display:block;width:min(100%,400px);height:auto;aspect-ratio:1;margin:12px auto;border-radius:15px;background:#e3f3ff;touch-action:none}.glow{animation:pulse .35s alternate 2}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>#filter,#scene,#random{display:none!important}body .lg92-trace-board{background:#fff9e9}body [data-trace-start]{fill:#ffc83d;filter:drop-shadow(0 0 3px #f0b800)}.slots.complete{box-shadow:0 0 20px #79edb1}.training139-paused{pointer-events:none;filter:blur(3px)}body.training139-paused *{animation-play-state:paused!important}</style>
<main><header><button id="back">← Od nowa</button><img src="../../space132/astronauta.png" alt=""></header><h1>Literki w kolejności</h1>
<div id="count"></div><div class="track" aria-hidden="true"><div class="fill"></div><img class="chest" src="../../space132/skrzynia.png" alt=""><img class="ship" src="../../space132/rakieta_przezroczysta.png" alt=""></div>
<div class="guide"><img src="../../space132/robot.png" alt=""><img class="wave" src="../../space132/fala_dzwiekowa.png" alt=""><p id="guide">Ułóż literki i poprowadź rakietę do następnej stacji.</p></div>
<section class="panel"><h2 id="heading"></h2><div id="play"></div><p class="message" role="status"></p></section>
<div class="row help"><button id="ai">Zapytaj nauczyciela AI</button><button id="mic" class="mic" aria-label="Zadaj pytanie przez mikrofon"><img src="../../space132/mikrofon.png" alt=""></button></div>
<p id="details" role="status"></p></main>
<script>

const mode="order";let rounds=Training139.restore?.rounds||Training139.config.orderRounds;
const $=s=>document.querySelector(s);
const play=$('#play'), message=$('.message'), heading=$('#heading');
let index=Training139.restore?.index||0;let correct=Training139.restore?.score||0,skipped=Training139.restore?.skipped||0,roundSolved=false;
const instruction=mode==='order'?'Dotykaj liter w kolejności alfabetu.':mode==='rhyme'?'Posłuchaj rymowanki i wskaż pierwszą literę odgadniętego słowa.':'Zacznij od świecącej kropki.';
function speak(text){
 if(!window.speechSynthesis){$('#details').textContent='Odsłuch wymaga polskiego głosu w przeglądarce.';return;}
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='pl-PL';
 utterance.onend=utterance.onerror=()=>document.body.classList.remove('listening');
 document.body.classList.add('listening');
 speechSynthesis.speak(utterance);
}
function element(tag,text,cls){
 const node=document.createElement(tag);
 if(text!==undefined)node.textContent=text;
 if(cls)node.className=cls;
 return node;
}
function button(text,action,cls){
 const node=element('button',text,cls);
 node.type='button';node.onclick=action;
 return node;
}
function progress(n){$('.track').style.setProperty('--done',n/rounds.length*100+'%');}
function render(){roundSolved=false;Training139.save({index,rounds,picks:[],score:correct,skipped,roundComplete:false,context:{question:"Ułóż litery w kolejności alfabetu.",answer:rounds[index]?.[1]?.join(", ")}});
 play.replaceChildren();message.textContent='';
 const q=rounds[index];
 progress(index);
 $('#count').textContent=q?'Wyzwanie '+(index+1)+' z '+rounds.length:'Trasa ukończona';
 if(!q){
  heading.textContent='Misja zakończona';message.textContent='Poprawne: '+correct+' · pominięte: '+skipped;
  play.append(button('Zagraj ponownie',()=>{index=0;render();},'gold'));
  return;
 }
 if(mode==='trace'){trace();return;}
 heading.textContent=mode==='order'?'Ułóż litery w kolejności.':'Jaka jest pierwsza litera?';
 const answer=mode==='order'?q[1]:[q[3]];
 let picks=[];
 if(mode==='rhyme')play.append(element('div',q[0],'picture'),element('p',q[1]),button('Posłuchaj rymowanki',()=>speak(q[1])));
 else play.append(button('Odczytaj polecenie',()=>speak(instruction)));
 const slots=element('div',undefined,'slots'), choices=element('div',undefined,'choices');
 if(mode==='order'){
  answer.forEach(()=>slots.append(element('span')));
  play.append(slots);
 }
 play.append(choices);
 const options=q[mode==='order'?0:2];
 for(const letter of options){
  const tile=element('div');
  const pick=button(letter,()=>{
   for(const b of choices.querySelectorAll('.bad'))b.classList.remove('bad');
   if(letter!==answer[picks.length]){
    pick.classList.add('bad');message.textContent='Spróbuj jeszcze raz.';return;
   }
   if(mode==='order')slots.children[picks.length].textContent=letter;
   picks.push(letter);Training139.save({index,rounds,picks,score:correct,skipped});if(picks.length===rounds[index][1].length)document.querySelector(".slots")?.classList.add("complete");pick.disabled=true;pick.classList.add('good');
   if(picks.length===answer.length){
    for(const b of choices.querySelectorAll('.pick'))b.disabled=true;
    message.textContent=mode==='rhyme'?q[4]+' zaczyna się na '+letter+'.':'Dobra kolejność: '+picks.join(' → ')+'.';
    correct++;roundSolved=true;Training139.save({index:index+1,picks:[],score:correct,roundComplete:true});progress(index+1);
    play.append(button('Dalej',()=>{index++;Training139.advance();render();},'gold'));
   } else message.textContent='Dobrze. Wybierz kolejną literę.';
  },'pick');
  const audio=button('♫',()=>speak(letter));
  audio.setAttribute('aria-label','Posłuchaj '+letter);
  tile.append(pick,audio);choices.append(tile);
 }
}
function trace(){
 heading.textContent='Pisz po śladzie';
 const select=element('select');
 select.setAttribute('aria-label','Wybierz znak');
 rounds.forEach(([glyph],n)=>{const option=element('option',glyph);option.value=n;select.append(option);});
 select.value=index;select.onchange=()=>{index=Number(select.value);render();};
 const [glyph,strokes]=rounds[index];
 const canvas=element('canvas');
 canvas.width=canvas.height=400;
 canvas.setAttribute('aria-label','Narysuj znak '+glyph+' od świecącej kropki');
 const ctx=canvas.getContext('2d');
 let piece=0,checkpoint=0,active=null,ink=[];
 function sample(stroke){
  return stroke.flatMap((end,n)=>{
   if(!n)return [end];
   const start=stroke[n-1], steps=Math.ceil(Math.hypot(end[0]-start[0],end[1]-start[1])/12);
   return Array.from({length:steps},(_,k)=>start.map((p,d)=>p+(end[d]-p)*(k+1)/steps));
  });
 }
 const paths=strokes.map(sample);
 function line(points,color,width,dashes=[]){
  if(!points.length)return;
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dashes);
  ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();ctx.setLineDash([]);
 }
 function draw(){
  ctx.clearRect(0,0,400,400);ctx.lineCap='round';ctx.lineJoin='round';
  for(const y of [65,135,265,335])line([[18,y],[382,y]],'#a6c7df',2);
  strokes.forEach(s=>line(s,'#607f9d',7,[6,9]));
  ink.forEach(s=>line(s,'#1674ce',8));
  if(paths[piece]){
   ctx.fillStyle='#e85822';ctx.beginPath();ctx.arc(...paths[piece][checkpoint],9,0,Math.PI*2);ctx.fill();
  }
 }
 function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*400/r.height];}
 function close(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])<20;}
 canvas.onpointerdown=e=>{
  if(!paths[piece]||active!==null)return;
  const p=point(e);
  if(!close(p,paths[piece][0])){message.textContent=instruction;return;}
  active=e.pointerId;canvas.setPointerCapture(active);checkpoint=0;ink[piece]=[p];draw();
 };
 canvas.onpointermove=e=>{
  if(e.pointerId!==active||!paths[piece])return;
  for(const event of e.getCoalescedEvents?.().length?e.getCoalescedEvents():[e]){
   const p=point(event), path=paths[piece];
   while(checkpoint+1<path.length&&close(p,path[checkpoint+1]))checkpoint++;
   if(close(p,path[checkpoint]))ink[piece].push(p);
  }
  draw();
 };
 function end(e,check){
  if(e.pointerId!==active)return;
  active=null;
  if(check&&checkpoint===paths[piece].length-1){
   piece++;
   if(piece===paths.length){message.textContent='Brawo! Znak gotowy.';correct++;roundSolved=true;Training139.save({index:index+1,picks:[],score:correct,roundComplete:true});progress(index+1);}
   else message.textContent='Teraz zacznij od nowej kropki.';
  }else{ink.length=piece;message.textContent='Spróbuj spokojnie poprowadzić linię do końca.';}
  checkpoint=0;draw();
 }
 canvas.onpointerup=e=>{canvas.onpointermove(e);end(e,true);};
 canvas.onpointercancel=e=>end(e,false);
 const toolbar=element('div',undefined,'row');
 toolbar.append(select,button('Posłuchaj znaku',()=>speak(glyph)));
 const controls=element('div',undefined,'row');
 controls.append(button('Wyczyść',()=>render()),button('Następny znak',()=>{index=(index+1)%rounds.length;render();},'gold'));
 play.append(toolbar,canvas,controls);message.textContent=instruction;
 $('#count').textContent='Znak '+(index+1)+' z '+rounds.length;
 draw();
}
$('#back').onclick=()=>Training139.back();
$('#ai').onclick=$('#mic').onclick=()=>{$('#details').textContent='W aplikacji ten przycisk otwiera istniejącą pomoc nauczyciela AI.';};
heading.textContent='Gotowi do startu?';
play.append(button('Zaczynamy',render,'gold'),button('Odczytaj polecenie',()=>speak(instruction)));

Training139.onSkip=()=>{if(!roundSolved){index++;skipped++;render();}};if(Training139.restore?.picks?.length){render();for(const wanted of Training139.restore.picks){[...play.querySelectorAll(".pick")].find(b=>b.textContent===wanted&&!b.disabled)?.click();}}
</script></html>
